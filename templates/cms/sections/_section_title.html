{% load i18n %}
{% if section_context.title or fallback_key %}
<div class="section-header">
  <h2 class="section-title">
    {% if section_context.title %}{{ section_context.title }}{% else %}{% trans fallback_key %}{% endif %}
  </h2>
  {% if cta_url %}
    <a href="{{ cta_url }}" class="section-cta"{% if cta_external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ cta_label|default:_("View All") }}</a>
  {% else %}
    <a href="{% url 'catalog:plp' %}" class="section-cta">{% trans "View All" %}</a>
  {% endif %}
</div>
{% endif %}
