{% load i18n %}
<div class="container pt-5" id="explore-collections-section">
  {% for grid in section_context.collection_sections %}
  <div class="{% if not forloop.last %}mb-5{% endif %}">
    <div class="section-header mb-4">
      <h2 class="section-title mb-0">{{ grid.collection.name }}</h2>
      <a href="{% url 'catalog:plp-collection' collection_slug=grid.collection.slug %}" class="section-cta">{% trans "View All" %}</a>
    </div>
    <div class="row g-0 jm-home-product-grid">
      {% for product in grid.products %}
      <div class="col-6 col-md-4 col-lg-3 jm-home-product-col">
        {% include "catalog/partials/product_card.html" with product=product %}
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
