{% load i18n %}
<div class="container py-5" id="explore-collections-section">
  {% for grid in section_context.collection_sections %}
  <div class="mb-5">
    <div class="d-flex justify-content-between align-items-baseline mb-4">
      <h2 class="section-title mb-0">{{ grid.collection.name }}</h2>
      <a href="{% url 'catalog:plp-collection' collection_slug=grid.collection.slug %}" class="small fw-semibold">{% trans "View all" %}</a>
    </div>
    <div class="row g-0 jm-home-product-grid">
      {% for product in grid.products %}
      <div class="col-6 col-md-4 col-lg-3 jm-product-col">
        {% include "catalog/partials/product_card.html" with product=product %}
      </div>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>
